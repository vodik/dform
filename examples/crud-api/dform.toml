# The crud-api project's root (docs/layout.md).

[project]
name = "crud-api"
dform = ">=0.1"

# The mock plays each: the built-in Kubernetes schema, and this project's
# own schemas for the Cloud SQL types and the random provider's extern
# (providers/<name>/schema.df, externs.df). Against a cluster,
# k8s = "providers/k8s" (a directory holding dform-provider-k8s).
[providers]
k8s = "k8s"
google = "providers/google"
random = "providers/random"
