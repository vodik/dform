<title>dform controller</title>
<!--
DESIGN NOTE: a mock of dform's controller UI, to start from, not to adopt.

VISUAL SYSTEM (v13). The layout, the drawing rule, disclosure, the fact
rule and the tabs below are unchanged; this is the paint on them.

Palette. Dark is the home theme: the CLI's own ground, a near-black
picked for contrast rather than blackness, so the two accents sit at 8
to 11:1 and a card can sit one step lighter without washing out.
  surfaces   --bg #0E100F   --surface #151816   --sunk #1C201E
             --term #0B0D0C (the plan text, the query box, a `dform` command)
  borders    --rule #262B28 (at rest)   --rule-2 #3A413C (a node, hover)
  text       --ink #E6EBE7   --muted #9EA7A2   --dim #78827D
  accents    --green #3EE07A   --orange #FF9C2A   (the terminal's 32 and 33)
  others     --red #FF6159  --magenta #E57CF0  --cyan #45D2E6  --blue #8FA3FF
Semantics follow crates/dform-core/src/report/style.rs, so a colour
means what it means under --color: `+` create and `>` adopt green; `~`
update orange, and with it drift (kind_paint paints Drift as Update),
pending, and a hold by a rule (the CLI's warn colour); `-` delete red,
and with it denied, a failing policy and bad health; `±` replace
magenta, and with it held for approval and a signature; `because` and
a watched source cyan; `=`, sites and notes dim. Waiting on a value has
no CLI colour; it takes the terminal's blue so it never reads as a
mark. A tint is the mark's colour mixed into the surface: 13% for a
changed node (--create-soft and its siblings), 7% for a reached one
(--reach-soft, orange, with a border only 30% orange: lighter than a
change, as the drawing rule says); a node a query lit takes cyan at 8%,
the banner's colour, so a query's light never reads as the plan's. Selection, focus and the chosen
estate are the ink itself, the terminal's reverse video, so neither
accent is spent on "you clicked here".
Light is derived, not inverted: warm off-white paper (--bg #EEEBE2,
--surface #FAF8F2, --sunk #E7E3D8, --term #F4F1E9, --rule #DCD7CA,
--rule-2 #C6C0B1, --ink #141712), the same hues deepened only as far as
small text on paper needs (--green #088D44, --orange #CC5C00, --red
#C42F1E, --magenta #A030AE, --cyan #087C8F, --blue #4356C2). Every
semantic and soft token is defined once on :root over these, so a theme
redefines the primitives and nothing else.

Type. JetBrains Mono (ligatures off, so `->` and `==` stay what was
typed) for everything the model holds: addresses, values, sites, the
plan text, marks, counts, graph cards. Atkinson Hyperlegible Next, a
quiet humanist sans, for labels, tabs, buttons and the few lines of
prose; uppercase labels in it at 11px with .09em tracking. Two faces
because the page has two voices, the model's and the page's; one mono
throughout made labels compete with addresses for the eye. Both monos
advance 0.6em, so the graph's character-count wrapping is unchanged.

Spacing is the scale below, unchanged. Radius by role: --r1 4px for
words and tags, --r2 8px for controls and buttons, 6px for a graph
card, --r3 12px for a panel (the graph, the plan, the inspector, an
estate card, a queue card). Borders are 1px and low contrast; a border
gets louder only for state (a mark's colour, the ink for selection),
never for decoration. No shadows, no gradients, no glow but the
watching dot's.

From the references: the terminal gave the palette and its meanings;
otel-desktop-viewer gave panels as rounded boxes on a ground one step
darker, low-contrast borders, tinted table heads and a quiet sans for
labels; Pocket ID gave the reverse-video primary button, the
borderless secondary on a fill, and the spacing.

The primary screen is the estate, not the plan. A controller spends most of
its life with nothing to apply: it health-checks and watches the estate
evolve. So the graph is the model at rest: one node per resource across
the deployments of one estate (one key value, below), an edge for every relationship the model
knows (a reference, a read of another stack's output, rows from a source,
a provider instance configured from a resource's value). Lanes are the
deployments, horizontal bands. Provider instances are columns crossing
them, because an instance is identified by what it reaches (an account and
region, a cluster) and several deployments of the tree share one (platform
and apps both reach the k3s-staging cluster), and because instances depend
on each other left to right (ovh makes the server whose kubeconfig
configures k8s). A node sits where its deployment meets its instance. Each
node carries its state at rest in words: health from `status`, its reading
from the four sources, a hold. The plan is an overlay on the same graph,
on when a plan exists: changed nodes lit with their mark and their state,
what they reach tinted with its distance in hops; no lines. This is not Argo's graph. Argo draws
ownership, Application > Deployment > Pod, so it answers "where does it
live" and makes you drill. This graph draws dependency and configuration,
so it answers "what depends on what, what is wrong, and where would a
change go", with the labels on.

Collapse rule, at every level: what has nothing to report folds. A rule's
rows (aws.subnet private-* ×4), a component copy or a namespace fold to
one node with a count; a deployment lane folds to a band; a provider
instance folds to a narrow column; a lane-by-instance cell folds to "N
objects"; in a cell that opened for one node, the quiet rest is one card,
"33 more, nothing to report", and a copy that opened for one member shows
that member in its frame, not its quiet siblings. A fold of one object is
that object.
Anything with news unfolds itself: changed or reached by the plan, health
not ready, a reading other than in sync or a provider default, a hold or
an approval, a fresh source. A click opens a fold; a lane header closes
what was opened by hand. A few hundred resources at rest read as the
handful that need attention plus counts.

Drawing rule: at rest there are no lines at all. Position is dependency:
within a region a node sits right of, or below, what it reads; a region
sits right of the region that configures it; a lane sits below the lanes
it reads. That is the whole account of lanes reading lanes, so no arc
says it again. A node clicked draws its direct edges, one hop each way,
thin, in one muted colour, with no arrowheads (direction is position);
a provider line only when its value or its region is the one clicked;
everything further downstream is tinted, not lined. The plan overlay
draws no lines: a changed node is lit with its mark, a reached node gets
a lighter tint and its distance in hops in its corner, the region a
change configures has its header lit. Nothing else is ever a line. Containment is the box, never a line:
no edge for a copy's members, a namespace's objects or a Service
selecting its pods.

Estate rule: the page goes project, then estate, then graph. A deployment
is a stack at a key value, so an estate is one key value (env=lab) and its
lanes are the stacks at that key (platform, apps; the lane header drops
the key the estate already says). A project is the set of its estates.
Under the project selector, one card per estate is both the project's
overview and the estate selector: its objects and health counts, its
plan's states in words, and how many of its decisions need a person. The
graph, its columns (only the instances that estate reaches), the plan
overlay and the Run tab's timeline are the estate's; "Waiting on a
person" stays project-wide, each card naming its estate, and choosing one
moves to its estate. The plan text and the World and Data tabs stay the
project's, as the CLI prints them. A watched source shows in every estate
it feeds. A relationship across estates would draw as an edge to the
other estate's card; none of these projects has one: every edge stays
inside one key value.

Disclosure rule: a card says its state in as few words as the state
needs, and the answer in the right column says the rest. A card is its
type (without the provider prefix its column already says), its name
(without the copy's prefix its frame already says), its health and its
reading as a word each ("ready · drift"; "in sync" is said by saying
nothing), and with the plan on its state: "pending", "applying", "applied
09:15 (run 77)", "waiting on kubeconfig", "held: signature". A hold shows
at rest too: it waits on a person. The `because`, a drift's who and when,
the reach, the policy verdict and the site are the node's answer, on
click. A region header is the instance and its state in a word; its
settings and calls are its answer. A lane header is the deployment and
its state in a word.

Time rule: the controller's clock is events and runs, never ticks. A run
is one reconcile woken by an event (a row in a watched source, a tag
moved under oci.resolve, drift read, a signature, time.now() crossing a
rule's boundary, a commit); ticks exist only inside a run, as its order.
Over an estate's life runs number in the thousands, and a tick number
restarts every run, so the graph and the cards never show one. The plan
text view keeps "tick 1", "tick 2": it is the CLI's text for one run. The
Run tab is the timeline of runs, newest first: what woke it, what it did,
how long, its longest chain, its trace, its audit entries in order.

Spacing scale, 4 8 12 16 24 32 px (--s1..--s6, SP in the graph): each
step is one kind of distance, so a gap says what it separates. 4 inside a
line; 8 inside a card and between a copy's box and its cards; 16 between
cards in a column, a card's gutter from its column's edge (32 between two
cards side by side) and between the right column's blocks; 24 above a
lane's first card and between the page's blocks; 32 between the graph and
the right column. A card is 200 to 320px wide; the last column takes what
is left, so the graph draws at one scale on every project, and grows
taller rather than denser. The right column widens to 460px when it
shows a resource.

Copy rule: a copy (a module copy, a component copy, a namespace's
objects) is one box, drawn once with its name once at its top left,
spanning the rank columns its members occupy, its members in rank order
inside it; several copies in one cell stack vertically below the cell's
loose cards. Folded, a copy is one card. A copy is never split into two
frames with one name (v7 drew one frame per column).

Selection rule: hover does nothing. A click selects a node and the
selection holds until the same node is clicked again, the graph's empty
background is clicked, or Escape; clicking another node switches it.
Edges, fades and outlines follow the selection only. Estate cards, tabs
and attribute lines switch on click.

Document rule: every node opens on the same panel, the resource itself.
Under a short header (health word, reading word, plan state, hold,
reach) comes its desired document as the plan prints a resource:
attribute lines, nested paths (spec.replicas = 1), lists keyed as the
plan keys them (containers[name=forgejo], env[FORGEJO__...],
networks[k3s.net]), secrets as their labels (#user_data), each with its
site, and where several statements wrote one key, its sources. A reading
other than in sync sits on the attribute's own line. Then World (the
values the provider returns), then Status (the node's health as the
model holds it). A watched source opens the same way, its document the
read expression. Values come from the program files: ovh-infra's own
(k3s.df, forgejo.df, synapse.df, pocket_id.df, stacks/platform.df,
config.df, policy.df) and examples/shop, examples/k3s-platform and
examples/gke-platform. A value the files cannot hold (an id, an
address, a uid, a digest the registry would return, an attribute of a
resource whose lines the mock does not carry) is the placeholder …,
shaded, with one key line at the top of every document; no value is
invented. An attribute's `why` opens under it on click; the resource's
whole `why` is a closed block below. gke-platform's cluster is
autopilot-private, so the example has no node pool.

Fact rule: the right column, the estate cards, the legend and the queue
show only what the model holds: addresses, attributes, sites, readings,
states, counts, the provider's words, and `why` trees whose nodes are
rules and lines. No explanation, advice, reassurance or summary.

The plan as text, and the tabs (the first version's primary screen, kept
behind the estate). The controller's job is to turn the program plus the
world plus the rows that arrived into changes, and to stop where policy
says stop; the question an operator brings is "what is about to change,
why, and who has to decide what". Argo answers "is the cluster what git
says" with a tree of objects and a sync button, because it has no model.
dform has one, so the screen is built from it:

1. A plan is readable: the plan text view is one run's plan as the CLI
   prints it, grouped by its ticks (toggle to group by deployment),
   `waits on` on the tick header, `later` as its own block, a `because`
   under every change that has one. Nothing is restated as a badge.
2. `why` on anything: every line, verdict, wait and row opens its
   explanation tree in the right column, each node with the FILE:LINE that
   made it. The right column is the inspector and it is always `why`.
3. Policy is queries: a hold, an approval, a drift, an ownership loss are
   cards in "waiting on a person", first on the page; their reason and site
   are their answer. An undetermined verdict and a wait on a read are not
   a person's: they are states on the graph. A hold has no "override" button: it is the program's. You lift it
   by changing the rule or the facts (a PR, a row). The only levers in the
   page are the ones the controller already has: a signature over a plan's
   digest, and `approve(T, A)` for drift.
4. The unit is the project. The left rail is project.df's deployments, the
   plan is the tree's, a deployment's line says its state and its lease.
5. Four sources: the World tab is desired | base | live | provider default
   per path, and the reading (change, drift, conflict, ownership lost,
   provider default) is a word, not a colour.
6. The Run tab is the timeline of runs; each has its trace (the waterfall,
   the longest chain, calls per provider) and its audit entries (seq, who,
   lease fence, digest).
7. The controller watches data: the Data tab is the relations the program
   declares, where their rows come from (a provider table, a csv, an SQL
   table), the rows that arrived and who wrote them, and what the rules
   derived from them, the plan itself included as `deformation`.
8. Magnitude: each change carries its reach (replaces, deletes, what reads
   it, what a provider configured from it reaches), and the plan's head says
   the shape against the last apply (aws.subnet 3 -> 4).

Rejected: the object graph as home (it answers what exists, not what will
change; references show up inside `why`); a Sync / Force button (the
controller applies what policy lets through; a person signs or writes a
row); health as the frame (health is not in the plan; `status` is a column);
red/amber/green verdicts (a verdict is text, a site and a tally); editing
values in forms (the program is code, reviewed; data rows go through the
store the program declares); a live log as the main view (today's log is
the controller's only interface; the page replaces it with state).

Open questions the mock ran into, marked "open" where they show:
- does a signature hold its whole tick (it signs the plan's digest) or only
  its deformation (docs/experimental/controller.md)? The mock holds the tick.
- a rule over time.now() (terry.org's eligibility) needs the controller to
  wake at the boundary it computes; the mock shows that as an event.
- the k3s replace shows a gap: objects read through a provider configured
  from a replaced server are "as state has them" until the read answers.

Data is from examples/shop, examples/k3s-platform, examples/gke-platform and
terry.org (on `use fake`). Times are 2026-10-15 UTC. Actions are mock.

CRITIQUE OF v5, by a second reader who did not build it (2026-10-15). Read
at 1440px, every project, at rest and with the plan, light and dark.

What works. The frame is right: lanes are deployments, columns are the
provider instances they reach, position is dependency, and what has
nothing to report folds. ovh-infra's ~120 objects come down to a drifted
Deployment and some counts; k3s-platform's story (a replaced server, a
kubeconfig nobody can read yet, three objects behind it) can be read off
the k8s-staging column alone. The reading is a word, the levers are the
controller's two (sign a digest, write an approve row), there is no sync
button, and the inspector is `why` plus what depends on the thing.

What fights the frame. (1) Lines at rest. The note says no edges at
rest and then draws three kinds: arcs in the left margin between lanes
(on gke-platform three of them leave one point and their arrowheads
strike the "s" of every "stacks."), arcs over the region headers
("dform io.read, oci.resolve reads 2 of ovh" printed on top of the
headers), and a dashed provider line from a platform lane's io cell up
to its k8s header, through every lane between (k3s-prod's crosses
apps[staging]'s cards). Each says what position already says. (2) Ticks.
The overlay steps "tick 1 / to tick 2 / to later", a changed card says
"~ tick 1", a reached one "reached in tick 1 ← …", a region header
"reached in tick 1". A tick is the order inside one run; a controller
runs for years, so a tick number is a counter that restarts every event
and tells a person nothing. What a node can say is its state: pending,
applying, applied (when, in which run), waiting on a value, held for a
person. Order is the graph's. (3) "Waiting on a person" holds "Waiting
on a read" (k3s) and "Undetermined" (shop), whose own text says "Nothing
to do": not a person's. (4) The note has two "primary screen"
paragraphs that contradict each other.

What is noise. Every quiet card says "in sync · health -", every folded
copy "all in sync · health not judged · stacks/apps.df:81 · open": the
word that should be silence is printed twenty times on ovh-infra. A copy
that opens because one member has news unfolds all of them: apps[prod]
shows forgejo's claim, two Services and a network policy, all quiet, to
reach the one drifted Deployment, and the copy splits across two
columns under two frames both labelled "forgejo: use forgejo { env,…".
Types repeat the column ("k8s.deployment" in the k8s column), names
repeat the frame ("forgejo.server" inside forgejo). Cards carry the
`because`, the cross-lane read, "→ 8 downstream" and the held reason in a
boxed tag; ovh-infra's drift tag overflows its card and most `because`
lines end in "…", which helps no one. Lane headers run to "reads 3 of
platform[env=lab] · reads 1 of watched sources 1 change · applies next ·
32 objects, nothing to report · open". The "held for approval" block
under the graph repeats the signature card; the legend is three lines.

Where the eye has nowhere to rest. Cards sit 8px apart with 6px inside,
frames touch them. Column widths follow rank count, so k3s's ovh column
gets three columns and k8s-staging a strip where "unknown: provider
cannot answer / not read since the replace" wraps to six lines; header
heights equalise to the tallest wrapped header (110px on ovh-infra, for a
truncated "slow: Read k3s.server.vm 4.1s of a 6.2s run…"). The SVG
stretches to the pane, so gke-platform and releases draw at 1.6× the type
size of ovh-infra: the same card is two sizes across projects. Two
toggles sit on two rows (graph | text, then plan off | tick 1).

What a person running this estate wants first: what waits on me, what is
broken, what is moving. On ovh-infra the one card that waits on a person
is under 1500px of graph, below the fold, and k3s prod's degraded
Deployment is one coloured line among many grey ones.

What v6 changed, each small: no lines at rest (the lane arcs, the region
arcs and the at-rest provider lines are gone; a provider line draws when
its value or instance is pointed at, or when the plan reaches it); no tick
on the graph, the cards, the lane headers, the controller's status line or
the `why` trees (a change's state instead, and run numbers); the Run tab
is the timeline of runs; "Waiting on a person" is first on the page, a
word and an address per card, and holds only what a person decides; one
switch, estate | estate + plan | plan text; the cards lose the provider
prefix, the copy's prefix, "in sync", "health -", the `because`, the
cross-lane read, the downstream count and the boxed tag, which all moved
to the answer in the right column (now headed by the node's health,
reading, plan state, because, hold, reach and site); a cell that opens for
one node folds its quiet rest into one card; the spacing scale above;
the graph draws at one scale on every project; the "held for approval"
block, the duplicate primary-screen paragraph and two of the legend's
three lines are gone.

What v7 changed: estates (the estate rule above). The page went from one
graph of every deployment to one graph per key value, an estate strip
under the project selector, the queue tagged with estates, runs per
estate, and lane headers without the key.

What v9 changed: no arrows anywhere (the drawing rule above); ovh-infra
opens on lab, where its plan is; a watched source is always a card,
never folded, in every estate it feeds, and the one that woke the last
run is lit as its origin, a solid outline and a "woke run 41" line. The
oci.resolve card had gone because v7 shows a source only in the estates
it feeds and v7 and v8 opened ovh-infra on prod, which lab's tag does not
feed; and a quiet source (releases' build and tested rows, a kubeconfig
read that answered) folded into its cell's count like any quiet object.

Query rule: the Query tab takes a dform query in the language's own
spelling, a head and a body, and answers with a table of the head's
columns; a row opens its derivation (facts and rules with sites) in the
right column. The mock answers only the queries it lists, and says so for
any other text. "save" makes the query a Data tab view: the Data tab is
saved queries, its relation views among them, each with its text. "light
in the estate" moves to the estate holding most of the rows' nodes and
tints every node the result names, as the overlay tints a reached node,
with no lines; a one-line banner names the query, with "clear".
ovh-infra's ovh.price is the provider's static table: flavor, region and
vcpus are the catalogue's (b2-7: 2, b2-15: 4), the prices are …

What v13 changed: the visual system above; no layout, behaviour or text.

What v12 changed: the query rule above.

What v11 changed: the document and fact rules above; invented world
values and status lines are gone, replaced by the placeholder or by the
model's health; commentary is gone from the sidebar.

What v8 changed: the document rule, the selection rule, the copy rule
and the wider spacing above; k3s-platform's server carries only the
attribute its plan changes, and releases and the rest of the nodes keep
v7's answer (no document in the mock).
-->

<style>
:root{
  color-scheme:light;
  /* surfaces, light: warm off-white paper, one step per role */
  --bg:#EEEBE2; --surface:#FAF8F2; --sunk:#E7E3D8; --term:#F4F1E9; --rule:#DCD7CA; --rule-2:#C6C0B1;
  --ink:#141712; --muted:#555A52; --dim:#6F746B;
  /* the terminal's colours, deepened for paper so text keeps 4.3:1 */
  --green:#088D44; --orange:#CC5C00; --red:#C42F1E; --magenta:#A030AE; --cyan:#087C8F; --blue:#4356C2;
  /* semantics: a mark means what it means in the plan's --color output */
  --create:var(--green); --update:var(--orange); --delete:var(--red); --replace:var(--magenta);
  --approval:var(--magenta); --because:var(--cyan); --wait:var(--blue); --accent:var(--ink);
  --create-soft:color-mix(in oklab,var(--create) 13%,var(--surface));
  --update-soft:color-mix(in oklab,var(--update) 13%,var(--surface));
  --delete-soft:color-mix(in oklab,var(--delete) 13%,var(--surface));
  --replace-soft:color-mix(in oklab,var(--replace) 13%,var(--surface));
  --approval-soft:color-mix(in oklab,var(--approval) 13%,var(--surface));
  --wait-soft:color-mix(in oklab,var(--wait) 13%,var(--surface));
  --reach-soft:color-mix(in oklab,var(--update) 7%,var(--surface));
  --accent-soft:color-mix(in oklab,var(--ink) 8%,var(--surface));
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:var(--sans);
  --r1:4px; --r2:8px; --r3:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E100F; --surface:#151816; --sunk:#1C201E; --term:#0B0D0C; --rule:#262B28; --rule-2:#3A413C;
    --ink:#E6EBE7; --muted:#9EA7A2; --dim:#78827D;
    --green:#3EE07A; --orange:#FF9C2A; --red:#FF6159; --magenta:#E57CF0; --cyan:#45D2E6; --blue:#8FA3FF;
  }
}

  color-scheme:dark;
  --bg:#0E100F; --surface:#151816; --sunk:#1C201E; --term:#0B0D0C; --rule:#262B28; --rule-2:#3A413C;
  --ink:#E6EBE7; --muted:#9EA7A2; --dim:#78827D;
  --green:#3EE07A; --orange:#FF9C2A; --red:#FF6159; --magenta:#E57CF0; --cyan:#45D2E6; --blue:#8FA3FF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-variant-ligatures:none;padding:0 24px 32px;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in oklab,var(--green) 30%,transparent)}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.lab{font:600 11px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dimt{color:var(--dim)}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0 12px;border-bottom:1px solid var(--rule)}

.projects button{border:1px solid var(--rule);background:var(--surface);padding:5px 12px;border-radius:var(--r2);cursor:pointer;font:500 13px var(--mono)}

function wrap(text, n, max) {
  const words = String(text).split(/(\s+)/), out = [];
  let cur = "";
  for (const w of words) {
    if ((cur + w).length > n && cur.trim()) { out.push(cur.trimEnd()); cur = w.trimStart(); }
    else cur += w;
    while (cur.length > n) { out.push(cur.slice(0, n)); cur = cur.slice(n); }
  }
  if (cur.trim()) out.push(cur.trimEnd());
  if (out.length > max) { out.length = max; out[max - 1] = out[max - 1].slice(0, Math.max(0, n - 1)) + "…"; }
  return out;
}

/* node: {id, lane, region, type, name, site, health, reading, group, lines, planned, kind}

const MODEL = {};
function model(lanes, regions, groups) {
  const m = {lanes, regions, groups: groups || {}, nodes: [], edges: []};
  m.N = (id, o) => m.nodes.push({id: "n:" + id, health: "-", reading: "in sync", lines: [], ...o});

  return m;
}

/* ---------- inspector for the estate ---------- */
function estateInsp(el) {
  const m = estModel(cur), p = P[cur];
  const byId = Object.fromEntries(m.nodes.map(n => [n.id, n]));
  let title = sel, tree = [], cmd = "", members = [], facts = [], doc = null, n0 = {};
  if (sel.startsWith("R:")) {
    const r = m.regions.find(r => "R:" + r.id === sel);
    title = "provider instance " + r.label; tree = [N(r.settings, "", ""), N(r.state, "", r.waiting ? "wait" : "ok"), ...(r.why || [])];
    members = m.nodes.filter(n => n.region === r.id);
  } else if (/^[GCQ]:/.test(sel)) {
    const k = sel.slice(2);
    members = sel.startsWith("G:") ? m.nodes.filter(n => n.group === k) : m.nodes.filter(n => n.lane + "|" + n.region === k);
    const g = m.groups[k];
    title = sel.startsWith("G:") ? `${g.label}` : `${members.length} objects with nothing to report`;
    if (g) facts.push(["site", g.site]);
    tree = members.map(n => N(`${n.type} ${n.name}`, n.site, "", [N(`health ${n.health || "-"} · ${n.reading}`)]));
  } else {
    const n = byId[sel]; if (!n) return false;
    const w = n.lines.map(id => WHY[id]).find(Boolean), st = nodeState(p, n);
    title = `${n.type} ${n.name}`;
    doc = docOf(cur, n);
    if (n.planned) facts.push(["exists", "no: planned"]);
    else if (n.kind !== "source") facts.push(["health", healthWord(n.health) || "not judged"]);
    if (!n.planned && readingWord(n)) facts.push(["reading", readingWord(n)]);
    if (st) {
      facts.push(["plan", `${st.mark} ${st.text}`]);
      if (st.l.because && !doc) facts.push(["because", st.l.because.replace(/^because /, "")]);
      if (st.l.held && !st.l.heldDone) facts.push(["held", st.l.held[1].replace(/^held\s+/, "")]);
      if (st.l.mag) facts.push(["reach", stripTags(st.l.mag)]);
    }
    nodeTags(n).filter(t => t[0] === "undet").forEach(t => facts.push(["policy", t[1]]));
    if (n.site && !doc) facts.push(["site", n.site]);
    if (w) { tree = w.tree; cmd = w.cmd; }
    else {
      cmd = n.kind === "source" ? "" : `dform why '${n.type} ${n.name}'`;
      const ins = m.edges.filter(([, b]) => b === n.id).map(([a, , k, label]) => byId[a] ? N(`${label} ← ${byId[a].type} ${byId[a].name}`, k === "output" ? "another deployment's output" : k === "rows" ? "rows" : "", k === "rows" ? "because" : "") : null).filter(Boolean);
      tree = ins.length ? [N(`${n.type} ${n.name}`, n.site, "", ins)] : [];
      const r = m.regions.find(r => r.id === n.region); tree.push(N(`held by provider instance ${r.label}`, r.settings));
    }
    members = [n]; n0 = n;
  }
  // what depends on this: the downstream closure
  const down = new Map();
  members.forEach(n => closure(m, n.id, false).forEach((par, k) => { if (!k.startsWith("R:") && !members.includes(byId[k])) down.set(k, par); }));
  if (sel.startsWith("R:")) members.forEach(n => down.set(n.id, sel));
  const byLane = {};
  down.forEach((par, k) => { const n = byId[k]; if (n) (byLane[n.lane] = byLane[n.lane] || []).push(n); });
  const laneName = (l) => l === "sources" ? SRC_LANE.name : ((p.deps.find(d => d.id === l) || {}).name || l);
  const depTree = Object.entries(byLane).map(([l, ns]) => N(laneName(l), `${ns.length}`, "", ns.map(n => N(`${n.type} ${n.name}${n.planned ? " (planned)" : ""}`, (m.regions.find(r => r.id === n.region) || {}).label))));
  const d = p.decisions.find(d => members.some(n => n.lines && n.lines.includes(d.line)));
  const phx = (t) => esc(t).split(PH).join(`<span class="ph">…</span>`);
  const docHTML = !doc ? "" : `<div class="blk2"><div class="lab">${doc.source ? "Source" : "Desired"}</div><div class="at-src" style="padding-left:0">${esc(doc.site)}</div>
      <div class="ph-key">values not in the program files are shown as <span class="ph">…</span></div>
      <div class="doc">${doc.a.map((a, i) => {
        const head = a.g && (i === 0 || doc.a[i - 1].g !== a.g) ? `<div class="at-g">${esc(a.g)}</div>` : "";
        const open = ATTR_OPEN.has(i), why = a.why || [N(`${a.p} = ${a.v}`, a.s || "provider", "", a.src ? [N(a.src)] : [])];
        return `${head}<div class="at ${a.g ? "in" : ""} ${a.r ? "rd-" + a.r[0].split(" ")[0] : ""}"><button class="at-b" data-attr="${i}" aria-expanded="${open}"><span class="at-m" aria-hidden="true">${open ? "▾" : "▸"}</span><span class="at-l"><span class="at-p">${esc(a.p)}</span> = <span class="at-v">${phx(a.v)}</span></span><span class="at-s">${esc(a.s || "provider")}</span></button>
          ${a.src ? `<div class="at-src">${esc(a.src)}</div>` : ""}${a.r ? `<div class="at-r"><span class="word w-${({drift: "drift", change: "change", "provider default": "default", "ownership lost": "owner"})[a.r[0]] || "unread"}">${esc(a.r[0])}</span> ${esc(a.r[1])}</div>` : ""}
          ${open ? `<div class="tree at-why">${treeHTML(why)}</div>` : ""}</div>`;
      }).join("")}</div></div>
    <div class="blk2"><div class="lab">World</div>
      <div class="doc">${doc.world.map(([k, v]) => `<div class="at"><div class="at-b static"><span class="at-m"></span><span class="at-l"><span class="at-p">${esc(k)}</span> = <span class="at-v">${phx(v)}</span></span><span class="at-s">world</span></div></div>`).join("")}</div></div>
    ${doc.source ? "" : `<div class="blk2"><div class="lab">Status</div><div class="doc"><div class="st-l ${healthCls(n0.health)}t">${esc(n0.health && n0.health !== "-" ? n0.health : "-")}</div></div></div>`}`;
  el.innerHTML = `<div class="lab">${doc ? (doc.source ? "Watched source" : "The resource") : "Why"}</div><h2>${esc(title)}</h2>
    ${facts.length ? `<dl class="kv">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
    ${docHTML}
    ${doc ? (tree.length ? `<details class="blk2"><summary class="lab">dform why</summary>${cmd ? `<div class="cmd">$ ${esc(cmd)}</div>` : ""}<div class="tree">${treeHTML(tree)}</div></details>` : "") : `${cmd ? `<div class="cmd">$ ${esc(cmd)}</div>` : ""}
    <div class="tree">${treeHTML(tree)}</div>`}
    <div class="acts"><div class="lab">What depends on this · ${down.size}</div>
      ${down.size ? `<div class="tree">${treeHTML(depTree)}</div>` : `<p>Nothing reads it.</p>`}</div>
    ${d && ACTS[d.id] ? `<div class="acts"><div class="lab">${esc(d.word)}</div>${ACTS[d.id]()}</div>` : ""}`;
  return true;
}

  const wf = () => `<div class="tw" style="padding:var(--s3)"><div class="wf" role="img" aria-label="Span waterfall of the run">
        <div class="axis"><div>span</div><div><span>0s</span><span>${(t.total / 2).toFixed(t.total < 10 ? 1 : 0)}s</span><span>${t.total}s</span></div><div></div></div>
        ${t.spans.map(s => `<div class="row"><div class="nm ${s[3] ? "ch" : ""}" title="${esc(s[0])}">${esc(s[0])}</div><div class="tr"><div class="bar ${s[3] ? "ch" : ""} ${s[4] ? "open" : ""}" style="left:${sc(s[1])};width:max(2px,${sc(s[2])})"></div></div><div class="d">${s[4] ? "open" : s[2] < 1 ? Math.round(s[2] * 1000) + "ms" : s[2].toFixed(1) + "s"}</div></div>`).join("")}
      </div></div><p class="note">Bold spans are the longest chain. ${esc(t.calls)}.${t.gap ? " " + esc(t.gap) : ""}</p>`;
  const table = (rows) => `<div class="tw"><table class="audit"><thead><tr><th>seq</th><th>time</th><th>kind</th><th>deployment</th><th>entry</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${fresh.has(r) ? "fresh" : ""}"><td>${r[0]}</td><td>${esc(r[1])}</td><td class="k-${r[2]}">${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join("")}
      </tbody></table></div>`;
  return `<section class="pane">
    <p class="note">One run is one reconcile, woken by an event: a row, a moved tag, drift read, a signature, a time boundary, a commit. Newest first; each run's audit entries read forward. Ticks are the order inside a run; the plan text shows them.</p>
    <div class="lab">Runs of ${esc(estLabel(cur, EST[cur]))}</div>
    ${RUNS[cur].filter(r => r.est === EST[cur]).map((r, i) => `<article class="run ${i ? "" : "cur"}">
      <div class="run-h"><b>run ${r.n}</b><span class="dimt">${esc(r.at)}</span>${r.state ? `<span class="stt ${r.state === "held" ? "held" : "waiting"}">${esc(r.state)}</span>` : ""}<span class="dimt run-t">${esc(r.took)}</span></div>
      <dl class="kv"><dt>woken by</dt><dd>${esc(r.event)}</dd><dt>did</dt><dd>${esc(r.did)}</dd>${r.trace ? `<dt>longest chain</dt><dd>${esc(t.chain)}</dd>` : ""}</dl>
      ${r.trace ? `<details ${i ? "" : "open"}><summary class="lab">Trace</summary>${wf()}</details>` : ""}
      ${r.rows.length ? `<details ${i ? "" : "open"}><summary class="lab">Audit · ${r.rows.length} entr${r.rows.length === 1 ? "y" : "ies"}</summary>${table(r.rows)}</details>` : ""}
    </article>`).join("")}
    ${RUNS[cur].some(r => r.est === EST[cur]) ? "" : `<p class="note">No run has touched ${esc(estLabel(cur, EST[cur]))} since the controller started.</p>`}
    <p class="note">dform log verify checks the chain. Each deployment keeps its own hash-chained log; a run's entries are merged by time.</p>
  </section>`;
}

function renderPane() {
  $("pane").innerHTML = {plan: renderPlan, world: renderWorld, query: renderQuery, data: renderData, run: renderRun}[tab]();
}

function treeHTML(nodes) {
  return `<ul>${nodes.map(n => {
    const label = `<span class="k-${n.k}">${esc(n.t).split(PH).join('<span class="ph">…</span>')}</span>${n.s ? `  <span class="s">${esc(n.s)}</span>` : ""}`;
    return n.c.length ? `<li><details open><summary>${label}</summary>${treeHTML(n.c)}</details></li>` : `<li class="leaf">${label}</li>`;
  }).join("")}</ul>`;
}
function renderInsp() {
  const el = $("insp");
  if (sel && sel.startsWith("q:") && queryInsp(el)) return;
  if (sel && /^(n:|R:|G:|C:|Q:)/.test(sel) && estateInsp(el)) return;
  if (!sel || !WHY[sel]) {
    el.innerHTML = `<div class="lab">Why</div><h2>Nothing selected</h2>`;
    return;
  }
  const w = WHY[sel];
  const dec = P[cur].decisions.find(d => d.id === sel || d.line === sel);
  el.innerHTML = `<div class="lab">Why</div><h2>${esc(w.title)}</h2>${dec && dec.id === sel ? `<p class="note">${esc(dec.r)}</p>` : ""}${w.cmd ? `<div class="cmd">$ ${esc(w.cmd)}</div>` : ""}
    <div class="tree">${treeHTML(w.tree)}</div>
    ${dec && ACTS[dec.id] ? `<div class="acts"><div class="lab">${esc(dec.word)}</div>${ACTS[dec.id]()}</div>` : ""}`;
}

/* ---------- mutations: the two levers ---------- */
function findLine(p, id) { for (const b of [...p.ticks, ...(p.extraTicks || [])]) for (const l of b.lines) if (l.id === id) return l; }
function addAudit(proj, row, r) { (r || RUNS[proj][0]).rows.push(row); fresh.add(row); }
function nextSeq(proj) { return Math.max(...RUNS[proj].flatMap(r => r.rows).filter(r => typeof r[0] === "number" && r[3] === "prod").map(r => r[0])) + 1; }

function sign() {
  const p = P.shop; DONE["d-appr"] = true;
  const r = newRun("shop", "09:52:07", "a signature over sha256:4f1c9e07… by simon@framework", "applying 6 changes", "prod");
  addAudit("shop", [nextSeq("shop"), "09:52:07", "approval", "prod", "verified: simon@framework signed sha256:4f1c9e07… (age1q8…f3k)"], r);
  p.ctl = {state: "applying", since: "09:52:07", detail: `run ${r.n} · lease fence 12`};
  p.deps[1].st = "applying · lease fence 12"; p.approvals = [];
  p.ticks[0].st = "waiting"; p.ticks[0].stNote = "applying"; p.ticks[0].applying = true; p.ticks[0].on = null;
  ["pg", "orders"].forEach(id => { findLine(p, id).heldDone = true; });
  toast(`Signed. Run ${r.n} applies.`); render();
  setTimeout(() => {
    addAudit("shop", [nextSeq("shop"), "09:52:08", "lease", "prod", "fence 12 · holder dform-controller@shop"], r);
    addAudit("shop", [nextSeq("shop"), "09:52:08", "apply_start", "prod", "who dform-controller · git a41c9e2 · approval seq " + (nextSeq("shop") - 2)], r);
    p.ticks[0].lines.forEach(l => { if (l.id !== "https" || DONE["d-drift"]) { l.applied = true; l.at = `09:52 (run ${r.n})`; } });
    p.ticks[0].st = "applied"; p.ticks[0].stNote = DONE["d-drift"] ? "applied 09:52:31" : "applied 09:52:31 · https held"; p.ticks[0].applying = false;
    p.ticks[1].applying = true;
    addAudit("shop", [nextSeq("shop"), "09:52:31", "action", "prod", "create aws.security_group postgres, update orders, create subnet 1d, web-us-east-1d, update storefront: ok"], r);
    DONE["d-und"] = true;
    p.policy = {head: "policy  4 hold", lines: [{id: "pol-pub", mark: "holds", text: "no public subnets", site: "stacks/shop.df:18", tally: "4 hold", under: "aws.subnet private-us-east-1d  map_public_ip_on_launch = false, decided once the subnet was made"}, ...p.policy.lines.slice(1)]};
    p.headline = "plan: 1 change (1 delete) over 1 tick" + (DONE["d-drift"] ? "" : ", 1 held (drift)") + "; policy: 4 hold";
    render();
    setTimeout(() => {
      const l = p.ticks[1].lines[0]; l.applied = true; l.at = `09:52 (run ${r.n})`; p.ticks[1].st = "applied"; p.ticks[1].stNote = "applied 09:52:40"; p.ticks[1].applying = false;
      addAudit("shop", [nextSeq("shop"), "09:52:40", "action", "prod", "delete aws.security_group postgres (deposed) ok"], r);
      addAudit("shop", [nextSeq("shop"), "09:52:40", "apply_end", "prod", DONE["d-drift"] ? "ok  tick 2" : "ok  tick 2 · 1 held: aws.security_group https"], r);
      r.state = DONE["d-drift"] ? "" : "held"; r.took = "33s";
      r.did = DONE["d-drift"] ? "applied 7 changes in prod" : "applied 6 changes in prod; https still held for its drift";
      p.deps[1].st = DONE["d-drift"] ? `up to date · applied 09:52 (run ${r.n})` : "held · 1 drift";
      p.deps[1].mark = DONE["d-drift"] ? "=" : "~";
      p.headline = DONE["d-drift"] ? "plan: 0 changes; policy: 4 hold" : "plan: 1 change (1 update), held: drift at ingress needs approval; policy: 4 hold";
      p.ctl = {state: "watching", since: "09:52:40", detail: `run ${r.n} · applied sha256:4f1c9e07…`};
      toast(`Run ${r.n} applied. no public subnets: holds.`); render();
    }, 1600);
  }, 1300);
}
function revert() {
  const p = P.shop; DONE["d-drift"] = true;
  const l = findLine(p, "https"); l.heldDone = true;
  const r = newRun("shop", "09:53:02", "an approve row for https by simon@framework", "", "prod");
  addAudit("shop", [nextSeq("shop"), "09:53:02", "controller", "prod", "approve(\"aws.security_group\", \"https\") by simon@framework"], r);
  if (DONE["d-appr"]) {
    l.applied = true; l.at = `09:53 (run ${r.n})`;
    addAudit("shop", [nextSeq("shop"), "09:53:04", "action", "prod", "update aws.security_group https ok · ingress[1] removed"], r);
    r.did = "reverted ingress[1] on https"; r.took = "2s"; r.state = "";
    p.headline = "plan: 0 changes; policy: 4 hold"; p.deps[1].mark = "="; p.deps[1].st = `up to date · applied 09:53 (run ${r.n})`;
    p.ticks[0].stNote = "applied";
  } else {
    r.did = "held: waits on the signature"; r.took = "2.3s"; r.state = "held";
  }
  toast("approve row written. The revert " + (DONE["d-appr"] ? "applied." : "waits on the signature with the rest.")); render();
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-qrun],[data-qpick],[data-qrow],[data-qsave],[data-qlight],[data-qclear],[data-attr],[data-est],[data-node],[data-lanehdr],[data-group],[data-mode],[data-p],[data-tab],[data-g],[data-v],[data-line],[data-dec],[data-dep],#sign,#revert,#revert-fj");
  if (!t) { if (sel && e.target.closest(".gwrap svg")) { sel = null; ATTR_OPEN.clear(); render(); } return; }
  if (t.id === "sign") return sign();
  if (t.id === "revert") return revert();
  if (t.id === "revert-fj") return revertFj();
  if (t.dataset.qrun) { runQuery(); sel = null; return render(); }
  if (t.dataset.qpick) { QTEXT[cur] = QUERIES[cur].find(q => q.id === t.dataset.qpick).text; QRES[cur] = t.dataset.qpick; sel = null; return render(); }
  if (t.dataset.qrow) { sel = "q:" + t.dataset.qrow; return render(); }
  if (t.dataset.qsave) { if (!SAVED[cur].includes(t.dataset.qsave)) SAVED[cur].push(t.dataset.qsave); toast("saved to Data"); return render(); }
  if (t.dataset.qlight) { lightQuery(t.dataset.qlight); return render(); }
  if (t.dataset.qclear) { LIGHT = null; return render(); }
  if (t.dataset.attr !== undefined) { const i = Number(t.dataset.attr); ATTR_OPEN.has(i) ? ATTR_OPEN.delete(i) : ATTR_OPEN.add(i); return renderInsp(); }
  if (t.dataset.node) { const again = sel === t.dataset.node; ATTR_OPEN.clear(); if (again) { sel = null; return render(); } sel = t.dataset.node; if (/^[GCQ]:/.test(sel)) expandRep(sel); if (NARROW.has(sel)) OPEN.region[sel.slice(2)] = true; }
  else if (t.dataset.lanehdr) { const l = t.dataset.lanehdr; if (OPEN.lane[l]) { delete OPEN.lane[l]; Object.keys(OPEN.cell).filter(k => k.startsWith(l + "|")).forEach(k => delete OPEN.cell[k]); Object.keys(OPEN.group).filter(k => k.startsWith(l + "/")).forEach(k => delete OPEN.group[k]); } else OPEN.lane[l] = true; }
  else if (t.dataset.group) { delete OPEN.group[t.dataset.group]; }
  else if (t.dataset.mode) { const k = t.dataset.mode; view = k === "text" ? "text" : "graph"; if (k !== "text") ov = k === "plan" ? null : 0; }
  else if (t.dataset.p) { cur = t.dataset.p; sel = null; ov = null; fresh.clear(); }
  else if (t.dataset.tab) tab = t.dataset.tab;
  else if (t.dataset.g) group = t.dataset.g;
  else if (t.dataset.dec) { sel = t.dataset.dec; const d = P[cur].decisions.find(d => d.id === sel); if (d) EST[cur] = decEst(cur, d); }
  else if (t.dataset.est) { EST[cur] = t.dataset.est; sel = null; }
  else if (t.dataset.line) { sel = t.dataset.line; }
  else if (t.dataset.dep) { group = "dep"; tab = "plan"; }
  render();
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-line][tabindex],[data-node][tabindex]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sel) { sel = null; ATTR_OPEN.clear(); render(); } });
let rz;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === "plan" && view === "graph") renderPane(); }, 120); });
sel = null;
render();
</script>
