// The dform provider protocol, version 1 (DESIGN.org "Providers and fact
// plugins", proposal E DR-18 with F's DR-18 addition).
//
// A provider is any executable. dform spawns it and reads one line from its
// stdout:
//
//   dform-provider|1|tcp://127.0.0.1:PORT
//
// (the protocol version, then where it serves this service), and speaks
// gRPC to it for the rest of the run. The provider exits when its stdin
// closes.
//
// The protocol carries facts, schema and documents, never rules. Plan and
// Apply are per resource: the engine owns ordering, parallelism, state and
// crash safety. A document is a Value (an Obj of the configured
// attributes); a value the engine does not know yet travels as a Null, and
// a sensitive computed value only ever as a Null of class SECRET, its label.
//
// The canonical contract is wit/dform-provider.wit (DESIGN.org R-13); this
// file is derived from it for a native provider, additively only: a call
// or a field is added there first. crates/dform-wit/tests/drift.rs fails
// when the two disagree on a call, a message or a field: change both.

syntax = "proto3";

package dform.v1;

service Provider {
  // Protocol version and capabilities. The first call.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Credentials, region, endpoint: a provider-defined config object.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // The schema as facts: the engine injects them as EDB.
  rpc Schema(SchemaRequest) returns (SchemaResponse);
  // An extern's answer: bound arguments in, rows out.
  rpc Query(QueryRequest) returns (stream Row);
  // Refresh one object by its remote id.
  rpc Read(ReadRequest) returns (ReadResponse);
  // Prior and desired document in, the diff and whether it replaces out.
  rpc Plan(PlanRequest) returns (PlanResponse);
  // Execute one planned action. The provider sends an ApplyEvent with an
  // `event` each time its view of the object changes, and last one with
  // the `result`: the object as it now is. A call that fails with
  // DEADLINE_EXCEEDED may have taken effect; any other failure changed
  // nothing. dform cancels the call (it stopped, or the call ran past its
  // timeout): a cancelled Apply may have taken effect, and a Create is
  // found again by its idempotency key on resume.
  rpc Apply(ApplyRequest) returns (stream ApplyEvent);
  // An object the engine does not manage yet, by remote id.
  rpc Import(ImportRequest) returns (ImportResponse);
  // A secret this provider holds, for the engine to configure another
  // provider with (R-45): refused without the deployment's lease.
  rpc Reveal(RevealRequest) returns (RevealResponse);
  // Each object's health as of now (R-203), for `dform status`. A
  // provider that must poll its API to answer does so inside the call.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// A value, as src/value.rs has it. A float is finite: NaN and the infinities
// are no value.
message Value {
  oneof kind {
    string str = 1;
    int64 int = 2;
    bool bool = 3;
    List list = 4;
    Obj obj = 5;
    // An IPv4 address as a number.
    uint32 ip = 6;
    IpNet ip_net = 7;
    IpRange ip_range = 8;
    Ref ref = 9;
    Ref cloud_ref = 10;
    Null null = 11;
    double float = 12;
  }
}

message List {
  repeated Value items = 1;
}

message Obj {
  map<string, Value> fields = 1;
}

message IpNet {
  uint32 addr = 1;
  uint32 prefix = 2;
}

message IpRange {
  uint32 start = 1;
  uint32 end = 2;
}

message Ref {
  string type = 1;
  string name = 2;
  string attr = 3;
}

// A labeled null (proposal E §2.2): a value nobody knows yet. `label` is
// `type/addr#path`; `ty` is the schema type the constant will have.
message Null {
  string label = 1;
  NullClass class = 2;
  string ty = 3;
  // A SECRET of another stack (a `stack_output`): where a provider holds
  // it. The provider that receives it in an Apply document reads the value
  // there, inside the call; dform never has it.
  optional Held held = 4;
}

// An object a provider manages for another deployment, and the path in it
// that holds a secret. A provider that is not `provider`, or cannot reach
// the object, refuses the Apply naming the resource and the path.
message Held {
  string provider = 1;
  // The deployment that manages the object, as the reading run names it.
  string deployment = 2;
  string type = 3;
  // The object's remote id.
  string remote = 4;
  string path = 5;
  // The keyed digest of the value when that deployment knew it, else
  // empty: it changes when the value does, so the reader's document does.
  string digest = 6;
}

enum NullClass {
  NULL_CLASS_UNSPECIFIED = 0;
  // A computed identity: never equal to a constant.
  FRESH = 1;
  // A computed non-identity: equality unknown until resolved.
  OPEN = 2;
  // A sensitive computed value: its constant never leaves the provider.
  SECRET = 3;
}

// A fact: a predicate and ground arguments.
message Fact {
  string pred = 1;
  repeated Value args = 2;
}

message HandshakeRequest {
  uint32 protocol_version = 1;
}

message HandshakeResponse {
  uint32 protocol_version = 1;
  // The provider's name: what state records as each object's provider.
  string name = 2;
  // "resource" (Read, Plan, Apply, Import), "fact" (Query), "inventory"
  // (Query answers cloud_exists/2, cloud_attr/4 and cloud_computed/4 with
  // every argument free), "managed" (Query answers
  // provider.created(Type, Name, Key, Remote) with Type, Name and Key
  // bound: the object an Apply CREATE or REPLACE of address Name with
  // idempotency key Key made, if it made one), "keep" (an Apply UPDATE
  // leaves each `keep` path as the object has it), "offline" (Plan, with
  // no credentials, answers as it would with them: from a schema it holds,
  // or a fake of its API; `dform test` asks it so).
  repeated string capabilities = 3;
  // The provider's build: its crate version and the git commit it was
  // built from (`0.1.0+1a2b3c4`). dform refuses one of its own built-in
  // providers (`fakecloud`, `kubernetes`) whose build is not its own.
  string version = 4;
  // The settings a program's `use` block gives it (`kubeconfig`), each
  // with whether its value is sensitive: a secret the program writes to
  // one not declared sensitive is refused at compile time (E0304).
  // Empty: the provider declares none, and any setting is passed as
  // written.
  repeated SettingDecl settings = 5;
  // The types the provider answers Health for (R-203): `dform status`
  // asks it of the objects of these types and of no other. Empty: it
  // answers for none.
  repeated string health = 6;
}

message SettingDecl {
  string name = 1;
  bool sensitive = 2;
}

message ConfigureRequest {
  // An Obj. The fake provider reads: `schemas` (a list of schema names or
  // paths), `world` and `inventory` (file paths), `chaos` (a list of
  // `apply --chaos` specs), `settings` (a program's `provider` block or
  // `provider_config`, at a second Configure; its `account` is reported).
  Value config = 1;
}

message ConfigureResponse {
  // The account (or project) the provider's credentials reach, when it can
  // tell: a program's `expect_account` is checked against it, and a
  // mismatch refuses to plan. The mock reports its `settings.account`.
  optional string account = 1;
  // What the provider wants the user to see of its configuration: the
  // credentials' form, their expiry, a right they lack. `provider check`
  // prints each as a line of its own; a run prints each on stderr.
  repeated string notes = 2;
}

message SchemaRequest {
  // When set, the per-type rows (type_attr, type_list_key, type_retry,
  // type_replace, type_mint) of these types and of the types they alias
  // (type_alias, closed), plus every type_provider and type_alias row: the
  // types a run names. Absent: the whole schema. A provider may answer
  // with more than asked; dform keeps what it needs.
  optional TypeFilter types = 1;
}

message TypeFilter {
  repeated string names = 1;
}

message SchemaResponse {
  // type_attr/4, type_list_key/3, type_provider/2, type_mint/3,
  // type_retry/2, type_replace/2.
  repeated Fact facts = 1;
  // The externs Query answers.
  repeated ExternDecl externs = 2;
  // Apply evaluates `assertions` (F DR-13): a refinement on a secret path
  // may be deferred to this provider.
  bool checks_refinements = 3;
  // Documents of the provider's own types. `dform provider check` runs its
  // resource checks with them against a provider that serves its own
  // schema (a real API's) instead of the synthetic one Configure names.
  repeated Example examples = 4;
}

message Example {
  string type = 1;
  // A document Apply CREATE can make.
  Value create = 2;
  // The same object changed in place, for Apply UPDATE.
  Value update = 3;
  // A dotted path `create` sets that Plan refuses the document without;
  // empty if there is none.
  string required = 4;
}

message ExternDecl {
  string pred = 1;
  uint32 arity = 2;
  // Per column, whether it is an input (`+`). Empty: any binding pattern.
  repeated bool input = 3;
}

message QueryRequest {
  string pred = 1;
  // Per column, whether it is an input (`+`).
  repeated bool input = 2;
  // The `+` columns' values, in order.
  repeated Value inputs = 3;
  // Per column, whether it is declared `secret(T)`. A provider answers a
  // secret column with a Null of class SECRET whose `held` says where it
  // keeps the value (its label is the engine's to choose), never the
  // value: the engine refuses a value there.
  repeated bool secret = 4;
}

// One answer: a full tuple of the predicate.
message Row {
  repeated Value values = 1;
}

message ReadRequest {
  string type = 1;
  string remote = 2;
  // The address state maps to this object, for messages.
  string name = 3;
}

message ReadResponse {
  // False: Read returns nothing for this id (gone, or not visible yet).
  bool found = 1;
  // The configured attributes.
  Value attrs = 2;
  // The computed values; a sensitive one as its SECRET null.
  Value computed = 3;
}

message PlanRequest {
  string type = 1;
  // The address name, for messages.
  string name = 2;
  // The world's document; absent for a create.
  optional Value prior = 3;
  // The desired document; absent for a delete. It may carry nulls.
  optional Value desired = 4;
  // The object's remote id; empty for a create. The desired document
  // leaves out what the provider picked (an Optional+Computed path the
  // program does not set), a generated name among them.
  string remote = 5;
}

message PlanResponse {
  // Leaf by leaf, in the provider's canonical spelling of paths.
  repeated Change changes = 1;
  // A change the provider cannot make in place.
  bool requires_replace = 2;
}

message Change {
  string path = 1;
  optional Value before = 2;
  optional Value after = 3;
  // Print neither side.
  bool sensitive = 4;
}

enum Op {
  OP_UNSPECIFIED = 0;
  // A new object named after `name`.
  CREATE = 1;
  // Change `remote` in place.
  UPDATE = 2;
  // Delete `remote`.
  DELETE = 3;
  // Take over `remote`, an object that exists but is not managed yet, and
  // configure it.
  ADOPT = 4;
  // A new object in place of `remote`: `create_first` keeps the old one
  // until a later DELETE, else it goes first.
  REPLACE = 5;
  // The tick's calls are done (a phase boundary). No object; `spans` is
  // the tick's schedule. A provider with a clock advances it.
  END_TICK = 6;
}

message ApplyRequest {
  Op op = 1;
  string type = 2;
  string name = 3;
  string remote = 4;
  // The desired document, nulls resolved except SECRET ones, which the
  // provider materializes.
  Value config = 5;
  bool create_first = 6;
  // Refinements on secret paths the engine cannot check (F DR-13): the
  // provider checks each after materializing and fails the action if one
  // does not hold.
  repeated Assertion assertions = 7;
  repeated Span spans = 8;
  // CREATE and REPLACE: a key unique to this intended creation. The same
  // key twice must not create twice: a second call with a key a first one
  // already made an object for answers with that object, whatever became
  // of the first call's answer. A provider whose API takes a client token
  // passes the key through. dform retries a call whose outcome it does not
  // know (DEADLINE_EXCEEDED, a crash, dform killed with it in flight) with
  // the same key, after asking for the object (the "managed" capability).
  string idempotency_key = 9;
  // UPDATE: paths of `config` the provider leaves as the object has them,
  // absent from `config` (R-164). dform sends one for a write-only secret
  // a run without the deployment's master proved unchanged: it cannot
  // send the value and the world never answers it. Only to a provider
  // with the "keep" capability; one that cannot leave a path as it is
  // refuses the call naming it.
  repeated string keep = 10;
}

// `path` OP `value`: OP is one of eq, ne, len_ge, len_le, prefix, or a
// refinement's own name with its arguments as `value` (F DR-13 revised):
// range [lo, hi], prefix_len_le N, prefix_len_ge N, enum [v, ...],
// regex "S", type "int|string|bool|inet".
message Assertion {
  string path = 1;
  string op = 2;
  Value value = 3;
  // What the failure says.
  string message = 4;
}

// One Apply call on the engine's clock.
message Span {
  string addr = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
}

message ApplyResponse {
  // The object's remote id; empty after a delete.
  string remote = 1;
  // The object's configured attributes as stored, and its computed values
  // (a sensitive one as its SECRET null).
  Value attrs = 2;
  Value computed = 3;
  // How long the call took on the provider's clock.
  uint64 elapsed_ms = 4;
  // What the provider wants the user to see.
  repeated string notes = 5;
}

// What a provider says while an Apply runs: its own view of the object
// changed (a poll that saw a new status, a retry), never on a timer.
// dform adds the elapsed time and prints `status` verbatim beside the
// change; `message` goes to the log.
message Event {
  // The object as the provider names it, for the log.
  string address = 1;
  optional string status = 2;
  optional string message = 3;
}

// One message of an Apply's stream: an event, or, last, the result. (The
// WIT's stream of events and future of the result, in one stream.)
message ApplyEvent {
  oneof kind {
    Event event = 1;
    ApplyResponse result = 2;
  }
}

message RevealRequest {
  // The secret: an object this provider manages, the path in it.
  Held held = 1;
  // The deployment's lease, as the run that holds it names it: refused
  // without one. Reveal is the engine's call, never a program's.
  string lease = 2;
}

message RevealResponse {
  // The secret's bytes, for the Configure call they are revealed into.
  bytes value = 1;
}

// An object a provider manages, as state holds it.
message Identity {
  string type = 1;
  // The address state maps to it, for messages.
  string name = 2;
  // Its remote id.
  string remote = 3;
}

message HealthRequest {
  // Objects of the types the handshake's `health` lists.
  repeated Identity objects = 1;
}

message HealthResponse {
  // One per object asked, in the order asked.
  repeated Health answers = 1;
}

// An object's health as its provider judges it now (R-203): what `dform
// status` prints, never a value a program reads, never in state, never
// waited on by an apply. DEGRADED means the API itself gave up; a state
// that may recover by itself is PROGRESSING.
message Health {
  HealthState state = 1;
  // One line, as the provider's API says it; never a sensitive value.
  string reason = 2;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  // Doing what it is for.
  HEALTHY = 1;
  // Getting there: a rollout, a build, a pod waiting on its image.
  PROGRESSING = 2;
  // The API gave up on it, or it is gone.
  DEGRADED = 3;
  // Stopped on purpose: paused, suspended, shut off.
  SUSPENDED = 4;
  // The provider cannot tell.
  UNKNOWN = 5;
}

message ImportRequest {
  string type = 1;
  string remote = 2;
}

message ImportResponse {
  bool found = 1;
  string type = 2;
  string name = 3;
  Value attrs = 4;
  Value computed = 5;
}
