// What dform offers a native provider beyond the protocol (R-13b, R-25):
// wit/host/dform-host.wit (`dform:host`) over gRPC, the canonical contract
// being the WIT. A file and a package of its own beside
// proto/dform/v1/provider.proto, which it does not change: a provider that
// never calls back is untouched by it.
//
// Four services:
//
// - `Host` is served by dform, one server per provider it starts. dform
//   names where in the provider's environment, `DFORM_HOST` (`unix:///PATH`
//   or `http://127.0.0.1:PORT`); a provider built with the SDK dials it
//   (`dform-sdk`) and calls `host.http.send(..)` there as a component calls
//   its imports.
// - `Manifest` is served by a provider beside `Provider`: what it uses of
//   the host and of the machine, which `dform provider check` prints beside
//   what dform.toml grants. A provider that does not serve it (UNIMPLEMENTED)
//   has an undeclared manifest. Its `schemes` are the location schemes it
//   reads (R-153).
// - `Io` is served by a provider whose manifest declares schemes: the
//   WIT's `io` exported, which dform calls for a read of one of them (the
//   program's `io.read("gs://..")`, or another provider's `Host.Read`,
//   which dform mediates) (R-155).
// - `Files` is `Io` under the name it had before R-155, kept so a
//   provider built then still serves its schemes: a provider serves both,
//   dform calls `Io`, and `Files` when a provider has no `Io`.
// - `Signer` is served by a provider whose manifest says it `signs`: the
//   WIT's `signer` exported, which dform calls to make a `signed`
//   credential's material of what it performed for it, and to sign each
//   request sent with it. Sans I/O: it reaches nothing itself.
//
// A failure is a `Failure` in the response, never a gRPC status, so its
// class (R-81's: final, retryable, maybe-applied) and `not-yet` travel as
// the WIT has them. A credential and a tunnel are handles: numbers this
// connection's `Open` and `Forward` gave, never values.

syntax = "proto3";

package dform.host.v1;

service Host {
  // secrets.open
  rpc Open(OpenRequest) returns (OpenResponse);
  // http.send
  rpc Send(SendRequest) returns (SendResponse);
  // io.read (R-153, R-155): the bytes at a location, in chunks.
  rpc Read(ReadRequest) returns (stream ReadChunk);
  // io.read-versioned (R-172): as `Read`, the first chunk carrying the
  // version the source names the bytes by, when it keeps versions.
  rpc ReadVersioned(ReadRequest) returns (stream ReadChunk);
  // ssh.exec
  rpc Exec(ExecRequest) returns (ExecResponse);
  // ssh.read, folded into io.read (R-153): `Read` of
  // `ssh://USER@HOST:PORT/PATH`, which serves it.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // ssh.write
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // ssh.forward
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // git.read, folded into io.read (R-153): `Read` of
  // `git+https://HOST/OWNER/REPO//PATH?ref=REV`, which serves it.
  rpc GitRead(GitReadRequest) returns (GitReadResponse);
  // git.commit
  rpc GitCommit(GitCommitRequest) returns (GitCommitResponse);
  // log.log
  rpc Log(LogRequest) returns (LogResponse);
  // cache.get
  rpc CacheGet(CacheGetRequest) returns (CacheGetResponse);
  // cache.put
  rpc CachePut(CachePutRequest) returns (CachePutResponse);
}

service Manifest {
  rpc Manifest(ManifestRequest) returns (ManifestResponse);
}

service Io {
  // io.read, of a scheme the provider declares.
  rpc Read(ReadRequest) returns (stream ReadChunk);
  // io.read-versioned (R-172): as `Read`, the first chunk carrying the
  // version the source names the bytes by, when it keeps versions.
  rpc ReadVersioned(ReadRequest) returns (stream ReadChunk);
}

// `Io` by its name before R-155.
service Files {
  // io.read, of a scheme the provider declares.
  rpc Read(ReadRequest) returns (stream ReadChunk);
}

// The WIT's `signer`, of a provider that signs.
service Signer {
  // signer.needs
  rpc Needs(NeedsRequest) returns (NeedsResponse);
  // signer.step
  rpc Step(StepRequest) returns (StepResponse);
  // signer.sign
  rpc Sign(SignRequest) returns (SignResponse);
  // signer.refresh
  rpc Refresh(RefreshRequest) returns (StepResponse);
}

// error-class, and not-yet-or-error's not-yet.
enum Kind {
  KIND_UNSPECIFIED = 0;
  FINAL = 1;
  RETRYABLE = 2;
  MAYBE_APPLIED = 3;
  // A read of what the world has not reached yet: not an error.
  NOT_YET = 4;
}

message Failure {
  Kind kind = 1;
  string message = 2;
}

message OpenRequest {
  // KIND:NAME, as dform.toml grants it.
  string name = 1;
}

message OpenResponse {
  optional Failure failure = 1;
  uint64 handle = 2;
  optional string endpoint = 3;
  optional string namespace = 4;
}

message Header {
  string name = 1;
  string value = 2;
}

message SendRequest {
  string method = 1;
  string url = 2;
  repeated Header headers = 3;
  bytes body = 4;
  optional uint32 timeout_ms = 5;
  // A handle from Open.
  optional uint64 auth = 6;
  // A handle from Forward.
  optional uint64 via = 7;
  // The limit it counts against, in the provider's word: the host paces
  // each bucket by what the server answers it. Unset: the default one.
  optional string bucket = 8;
  // The session of the call it is sent for (a configured instance of the
  // provider): each session's buckets are paced apart. 0: none, a request
  // outside a call.
  uint64 session = 9;
}

message SendResponse {
  optional Failure failure = 1;
  uint32 status = 2;
  repeated Header headers = 3;
  bytes body = 4;
}

message Target {
  string host = 1;
  string user = 2;
  optional uint32 port = 3;
}

message ReadRequest {
  // A uri: `ssh://USER@HOST/PATH`, `https://..`, `s3://BUCKET/KEY`.
  string location = 1;
}

// A part of what was read, in order; a failure (or not-yet) is the one
// chunk.
message ReadChunk {
  optional Failure failure = 1;
  bytes data = 2;
  // The version of what is read (`ReadVersioned`'s first chunk): a secret
  // manager's version id.
  optional string version = 3;
}

message ExecRequest {
  Target on = 1;
  repeated string argv = 2;
  optional bytes stdin = 3;
}

message ExecResponse {
  optional Failure failure = 1;
  int32 status = 2;
  bytes stdout = 3;
  bytes stderr = 4;
}

message ReadFileRequest {
  Target on = 1;
  string path = 2;
}

message ReadFileResponse {
  optional Failure failure = 1;
  bytes data = 2;
}

message WriteFileRequest {
  Target on = 1;
  string path = 2;
  bytes data = 3;
  uint32 mode = 4;
}

message WriteFileResponse {
  optional Failure failure = 1;
}

message ForwardRequest {
  Target via = 1;
  string host = 2;
  uint32 port = 3;
}

message ForwardResponse {
  optional Failure failure = 1;
  uint64 tunnel = 2;
}

message GitReadRequest {
  string repo = 1;
  string rev = 2;
  string path = 3;
}

message GitReadResponse {
  optional Failure failure = 1;
  bytes data = 2;
}

message GitFile {
  string path = 1;
  bytes data = 2;
}

message GitCommitRequest {
  string repo = 1;
  string branch = 2;
  repeated GitFile files = 3;
  string message = 4;
}

message GitCommitResponse {
  optional Failure failure = 1;
  string commit = 2;
}

enum Level {
  LEVEL_UNSPECIFIED = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}

message LogRequest {
  Level level = 1;
  string message = 2;
}

message LogResponse {}

// cache.scope. CACHE_SCOPE_UNSPECIFIED is refused.
enum CacheScope {
  CACHE_SCOPE_UNSPECIFIED = 0;
  SESSION = 1;
  RUN = 2;
  ACCOUNT = 3;
  PROVIDER = 4;
}

// Where a get or a put is made. A component's host knows the call it is
// made in; a native provider's names it: the session of its call, and
// that session's account as its first Configure named it
// (`dform_core::plugin::host::account_of`). A native provider runs as the
// operator, so this is a statement, not a wall.
message CacheAt {
  CacheScope scope = 1;
  uint64 session = 2;
  string account = 3;
}

message CacheGetRequest {
  CacheAt at = 1;
  string key = 2;
}

message CacheGetResponse {
  optional bytes value = 1;
}

message CachePutRequest {
  CacheAt at = 1;
  string key = 2;
  bytes value = 3;
}

message CachePutResponse {}

message ManifestRequest {}

message ManifestResponse {
  // The interfaces it uses, unversioned: `dform:host/http`,
  // `wasi:sockets/tcp`.
  repeated string imports = 1;
  // The location schemes it reads, served by its `Files` (`gs`).
  repeated string schemes = 2;
  // It serves `Signer`.
  bool signs = 3;
}

// The signer's request (the WIT's `signer.request`): one to sign, or a
// fetch to perform.
message SignerRequest {
  string method = 1;
  string url = 2;
  repeated Header headers = 3;
  bytes body = 4;
}

message Need {
  message Strings {
    repeated string values = 1;
  }
  // A command: its argv, and the variables set for it beside the host's.
  message Command {
    repeated string argv = 1;
    repeated Header env = 2;
  }
  message Given {}
  // `exec` was its argv alone.
  reserved 3;
  oneof need {
    Strings env = 1;
    string file = 2;
    SignerRequest fetch = 4;
    Command exec = 5;
    Given given = 6;
  }
}

message Got {
  message File {
    optional bytes data = 1;
  }
  message Fetched {
    uint32 status = 1;
    repeated Header headers = 2;
    bytes body = 3;
    uint64 at = 4;
  }
  // The grant's values, by name.
  message Given {
    repeated Value values = 1;
  }
  message Value {
    string name = 1;
    bytes value = 2;
  }
  oneof got {
    Headers env = 1;
    File file = 2;
    bytes exec = 3;
    Fetched fetch = 4;
    Given given = 5;
  }
}

// Names and values: the variables an `env` need got.
message Headers {
  repeated Header values = 1;
}

// One way the host applies a material (the WIT's `recipe`).
message Recipe {
  message TlsClient {
    bytes cert = 1;
    bytes key = 2;
  }
  message Signed {}
  message Insecure {}
  oneof recipe {
    string bearer = 1;
    Headers headers = 2;
    Signed signed = 3;
    TlsClient tls_client = 4;
    string proxy = 5;
    bytes ca = 6;
    Insecure insecure = 7;
    string server_name = 8;
  }
}

message Material {
  bytes bytes = 1;
  // The one recipe it had, before it had several.
  reserved 2 to 6;
  optional uint64 expires = 7;
  repeated Recipe recipe = 8;
  optional string endpoint = 9;
  optional string namespace = 10;
}

message NeedsRequest {}

message NeedsResponse {
  repeated Need needs = 1;
}

message StepRequest {
  repeated Got got = 1;
}

// A step's outcome, or why there is none: `more` needs, or the material.
message StepResponse {
  optional string error = 1;
  repeated Need more = 2;
  optional Material material = 3;
}

message SignRequest {
  SignerRequest request = 1;
  Material material = 2;
  uint64 now = 3;
}

message SignResponse {
  optional string error = 1;
  SignerRequest request = 2;
}

message RefreshRequest {
  Material material = 1;
  uint64 now = 2;
}
