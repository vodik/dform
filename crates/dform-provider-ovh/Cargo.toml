[package]
name = "dform-provider-ovh"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# Built with the SDK (`dform_sdk::provider!`): the executable dform starts
# (`cargo build`), or the component dform's wasm host runs (`cargo build
# --target wasm32-wasip3 --features component`, `cargo xtask components`).
[lib]
crate-type = ["rlib", "cdylib"]

[features]
# `fake`: an OVH API server in the test process (`src/fake/`), for tests,
# and dform's host in that process for the provider's code run there.
fake = ["dep:dform-host"]
component = ["dform-sdk/component"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
dform-core = { path = "../dform-core" }
# Its requests go through the host's HTTP (`dform_sdk::host().http`):
# dform's pool, its pacing, its trace; the signing stays here (`sign.rs`).
dform-sdk = { path = "../dform-sdk" }
dform-host = { path = "../dform-host", optional = true }
# A service account's client id and secret as Basic auth, to mint its
# bearer token (`api.rs`).
base64 = "0.22"
# The request signature: SHA-1 over the signed request (`sign.rs`).
sha1 = "0.10"
# The user data's digest the provider keeps (`record.rs`).
sha2 = "0.10"

[dev-dependencies]
dform-provider-ovh = { path = ".", features = ["fake"] }
