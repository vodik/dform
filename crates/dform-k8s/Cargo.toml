[package]
name = "dform-k8s"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
tonic = "0.13"
dform-core = { path = "../dform-core" }
dform-grpc = { path = "../dform-grpc" }
# The host's HTTP and credentials: the provider's only way to the API
# server (cluster.rs).
dform-sdk = { path = "../dform-sdk" }
# The chain of errors behind an offline line, under `DFORM_LOG=debug`
# (`dform_core::log`).
tracing = { version = "0.1", default-features = false, features = ["std"] }
