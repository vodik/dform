# The language server, `dform lsp`: synchronous over stdio (lsp-server),
# evaluating with the mock linked in (dform-mock), never a provider
# process unless the client opts in.
[package]
name = "dform-lsp"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rowan = "0.16"
dform-core = { path = "../dform-core" }
dform-mock = { path = "../dform-mock" }
dform-s3 = { path = "../dform-s3" }
