# The command line over the mock linked in: for tests and benches, which
# run the same programs as `dform` without a provider process. Not a
# production path.
[package]
name = "dform-direct"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dform = { path = "../.." }
dform-core = { path = "../dform-core" }
dform-mock = { path = "../dform-mock" }
# `dform-approve`, the example signer (examples/approvals/).
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "2"
serde_json = "1.0"
