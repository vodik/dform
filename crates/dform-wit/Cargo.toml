[package]
name = "dform-wit"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# The provider contract as WIT (`wit/`, DESIGN.org R-13): host-side
# bindings (wasmtime) and guest-side bindings (wit-bindgen), each behind
# its feature. Both are on by default so the workspace build checks the
# package; a consumer takes the side it needs with
# `default-features = false`.
[features]
default = ["host", "guest"]
host = ["dep:wasmtime"]
guest = ["dep:wit-bindgen"]

[dependencies]
# The provider's calls are async (the component model's async ABI,
# R-130): wasmtime's `component-model-async`, wit-bindgen's `async`.
wasmtime = { version = "49", default-features = false, features = ["component-model", "component-model-async", "runtime", "std"], optional = true }
wit-bindgen = { version = "0.57", features = ["async", "async-spawn"], optional = true }

[build-dependencies]
# The proto's descriptor set, for tests/drift.rs.
prost-build = "0.13"

[dev-dependencies]
# tests/drift.rs: the proto's descriptor set and the WIT package, walked.
prost = "0.13"
prost-types = "0.13"
wit-parser = "0.258"
# The conversions' test (`convert!` over the guest bindings).
dform-wire = { path = "../dform-wire" }
dform-core = { path = "../dform-core" }
serde_json = "1.0"
