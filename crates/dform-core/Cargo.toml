[package]
name = "dform-core"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

[features]
# Test-only mutants, off unless a test sets them at run time: the model
# test's (`executor::hooks`) and the property test's planted Rule 3 bugs
# (`src/hooks.rs`). Only dev-dependencies turn the feature on; the `dform`
# binary never carries it (CI checks).
test-hooks = []

[dependencies]
anyhow = "1.0"
# The audit sink's process group (`killpg`) and the interrupt's
# `sigaction` (src/interrupt.rs).
libc = "0.2"
ariadne = "0.6"
logos = "0.16"
rowan = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
prost = "0.13"
# `regex(S)` refinements (src/refine.rs); `regex.*` (std/regex.df).
regex = "1"
# `hash.*` (std/hash.df).
sha2 = "0.10"
# Approvals (src/approval.rs): DSSE envelopes signed with ed25519, and JWTs
# (RS256, ES256, EdDSA) verified against a JWKS; pure Rust crypto. Also
# `base64.*` (std/base64.df).
base64 = "0.22"
ed25519-dalek = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
dform-wire = { path = "../dform-wire" }
# Tables (src/tables.rs). serde_yaml is archived but sound; its fork
# serde_yml is not (RUSTSEC-2025-0068).
csv = "1"
serde_yaml = "0.9"
toml = "1"
# dform.toml's version requirements (src/project.rs), Cargo's syntax;
# `semver.*` (std/semver.df).
semver = "1"
# `uri` (R-134, std/uri.df): RFC 3986's generic syntax is dform's own
# (src/uri.rs); a host is compared and sent by its A-labels, UTS 46
# through `idna` (already a dependency of the HTTP stack's), and held as
# written in NFC (`unicode-normalization`, idna's own dependency).
idna = "1"
unicode-normalization = "0.1"
# A host label that mixes scripts, or that is wholly in a script confusable
# with Latin, is a plan warning (R-134, UTS 39's mixed-script and
# confusable detection; its `unicode-script` is its own dependency).
unicode-security = "0.1"
# `uri.escape` (std/uri.df): percent-encoding, depended on directly for
# its `AsciiSet`.
percent-encoding = "2"
# `time` and `duration` (R-62): the Temporal model. Zone data is the
# bundled tzdb (jiff-tzdb), never the host's, so a plan is the same on
# every machine; `dform version` prints its version.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "0.1"
# The held store (src/secrets.rs, R-60): sealed memos are XChaCha20-Poly1305
# under a key HKDF derives from the stack's; `random.*` derives by HKDF.
chacha20poly1305 = "0.10"
# A master sealed under a passphrase (src/custody.rs, R-164): scrypt mixes
# the key from it; already in the tree through russh's key formats.
scrypt = { version = "0.12", default-features = false }
# A secret output sealed to the stacks that read it (src/custody.rs,
# R-166): X25519 to each reader's public key, which its master derives;
# the curve ed25519-dalek is built on, already in the tree.
curve25519-dalek = { version = "4", default-features = false }
# A master sealed to a team's age recipients (src/custody.rs, After
# R-164): X25519 recipients, the identities the operators hold.
age = { version = "0.11", default-features = false }
hkdf = "0.12"
# The plan key's digests (`zset::file::Key::digest`): HMAC-SHA256, the
# same `hmac` the `hkdf` crate is built on.
hmac = "0.12"

# The built-in `ssh` provider (src/plugin/ssh.rs): an SSH client in
# process, never the `ssh` binary; exec and SFTP. `ring` for its crypto
# (already in the tree through rustls), not aws-lc-rs's C build. The key
# formats and the agent client are russh's own `keys` module (the
# separate russh-keys crate was folded into it). Not on wasm: a provider
# component links dform-core, and tokio's networking does not build there
# (src/plugin/ssh_wasm.rs stands in).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util"] }
# Git without the `git` binary (R-103, house rules): the program's own
# repository (HEAD, what is modified, a tree at a commit for `diff
# --since`, the controller's watch) and the mirrors a `git+https://` or
# `git+ssh://` location is read through (src/git.rs). Fetched over the
# HTTP client below (gix-transport's `http-client`, the trait only: no
# curl, no reqwest, no second TLS stack) and over russh; gix's own ssh
# and file transports, which spawn programs, are never used.
gix = { version = "0.88", default-features = false, features = ["sha1", "revision", "status", "blocking-network-client"] }
gix-transport = { version = "0.60", default-features = false, features = ["http-client"] }
# The one HTTP client (R-103): `https://` locations, git over https, the
# JWKS an approval is verified against. Blocking, rustls with the
# machine's CA (the platform verifier), as dform-host's and dform-s3's.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
