[package]
name = "dform-provider-fake"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# The mock behind the provider protocol, written with the SDK (R-13b): the
# executable over gRPC (`cargo build`), or the component dform's wasm host
# runs (`cargo build --target wasm32-wasip3 --features component`:
# target/wasm32-wasip3/debug/dform_provider_fake.wasm).
[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Its world, inventory and schemas are files: the SDK's `filesystem`.
component = ["dform-sdk/component", "dform-sdk/filesystem"]

[dependencies]
dform-mock = { path = "../dform-mock" }
dform-sdk = { path = "../dform-sdk" }
