[package]
name = "dform-provider-tailscale"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# The Tailscale provider (R-197), written with the SDK: a tailnet's policy
# file, its auth keys, its DNS settings and the devices on it, over the
# Tailscale API v2, every request through the host's HTTP client. Built
# natively (`cargo build`), or as a wasm provider with the `component`
# feature (`cargo build --target wasm32-wasip3 --features component`,
# `cargo xtask components`).
[lib]
crate-type = ["rlib", "cdylib"]

[features]
# `fake`: a Tailscale API in the test process (`src/fake.rs`), for tests.
fake = []
component = ["dform-sdk/component"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dform-sdk = { path = "../dform-sdk" }

[dev-dependencies]
dform-provider-tailscale = { path = ".", features = ["fake"] }
