[package]
name = "dform-host"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# dform's side of `dform:host` (wit/host/dform-host.wit, R-13b): the
# credentialed transports a provider reaches through dform, served to a
# native provider as the `Host` gRPC service (proto/dform/host/v1), and
# the launcher the CLI starts providers with.
#
# `wasm` (experimental, R-13b amendment 4) adds the component host: a
# provider that is a `.wasm` component runs in wasmtime with the same
# interfaces as imports. Without it nothing here needs wasmtime or a wasm
# target, and a `.wasm` source is refused naming the feature.
[features]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:dform-wit", "dep:sha2", "dep:http", "dep:bytes", "dep:http-body-util"]

[dependencies]
anyhow = "1.0"
dform-core = { path = "../dform-core" }
# A request's wait on its window, a `ratelimit.wait` span
# (`dform_core::timing`).
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
dform-grpc = { path = "../dform-grpc" }
dform-wire = { path = "../dform-wire" }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
tonic = "0.13"
# The component host (`wasm`).
# `async` and `component-model-async`: the provider's calls are async
# (R-130), several in flight on one instance.
wasmtime = { version = "=49.0.1", default-features = false, features = ["component-model", "component-model-async", "async", "runtime", "std", "cranelift", "parallel-compilation", "wat", "anyhow"], optional = true }
wasmtime-wasi = { version = "=49.0.1", optional = true }
wasmtime-wasi-http = { version = "=49.0.1", optional = true }
# A component's `wasi:http` request as the host's `send` takes it
# (`wasm::Outgoing`): the types wasmtime-wasi-http's hooks speak.
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
dform-wit = { path = "../dform-wit", default-features = false, features = ["host"], optional = true }
# The compiled component's cache key.
sha2 = { version = "0.10", optional = true }


[dev-dependencies]
# A local HTTP server for the tests of what the host sends (`http::fake`).
dform-core = { path = "../dform-core", features = ["fake"] }
# services.rs's tests read the spans its calls are in.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
