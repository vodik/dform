[package]
name = "dform-sdk"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# The provider SDK (R-25, R-13b): one API over the host's interfaces
# (`host().http.request(..)`, `host().ssh.exec(..)`) whichever way the
# provider is built, `#[derive(Resource)]` for its schema, and the entry
# point (`provider!`). Built natively it serves the protocol over gRPC and
# calls the host back over the `Host` service; built with
# `--target wasm32-wasip3 --features component` it is a component whose
# imports are the host's interfaces (wit/host).
[features]
component = ["dep:wit-bindgen", "dep:dform-wit", "dep:futures"]
# A component that reads files (granted `wasi:filesystem`): it starts in
# the host's working directory, as a native provider does.
filesystem = ["component"]

# The probe of the async ABI: a component whose Read sends two requests at
# once (tests/host_wasm.rs).
[[example]]
name = "fetch_at_once"
crate-type = ["cdylib"]
required-features = ["component"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dform-core = { path = "../dform-core" }
dform-wire = { path = "../dform-wire" }
dform-sdk-derive = { path = "../dform-sdk-derive" }
# The provider's exports are async (R-130): a task per Apply.
wit-bindgen = { version = "0.61", features = ["async", "async-spawn"], optional = true }
dform-wit = { path = "../dform-wit", default-features = false, optional = true }
# A component's requests at once (`Http::request_all`): the host's sends
# joined, each a subtask.
futures = { version = "0.3", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dform-grpc = { path = "../dform-grpc" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time"] }
tonic = "0.13"
