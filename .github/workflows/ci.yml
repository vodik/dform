name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (build.rs generates the provider protocol)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --verbose

      - name: dform-core builds without a network stack
        run: |
          cargo build -p dform-core
          if cargo tree -p dform-core -e normal,build | grep -E '\b(tonic|tokio|hyper)\b'; then
            echo "dform-core depends on a network crate (above)" >&2
            exit 1
          fi

      - name: the executor's test hooks stay out of the dform binary
        run: |
          if cargo tree -p dform -e normal,build -f '{p} {f}' | grep test-hooks; then
            echo "a normal dependency turns on dform-core's test-hooks (above)" >&2
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace --verbose

      - name: plan examples/demo
        run: cargo run -q -- --file examples/demo/stacks/dform.df plan

      - name: plan examples/pngu in prod
        run: cargo run -q -- --file examples/pngu/stacks/pngu.df plan --set env=prod
