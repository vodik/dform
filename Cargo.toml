[workspace]
members = [
    ".",
    "crates/dform-wire",
    "crates/dform-core",
    "crates/dform-grpc",
    "crates/dform-mock",
    "crates/dform-k8s",
    "crates/dform-provider-fake",
    "crates/dform-provider-k8s",
    "crates/dform-provider-ovh",
    "crates/dform-provider-postgres",
    "crates/dform-provider-vault",
    "crates/dform-provider-tailscale",
    "crates/dform-direct",
    "crates/dform-proptest",
    "crates/dform-s3",
    "crates/dform-lsp",
    "crates/dform-wit",
    "crates/dform-signer",
    "crates/dform-host",
    "crates/dform-sdk",
    "crates/dform-sdk-derive",
    "tree-sitter-dform",
    "xtask",
]
# `cargo build` and `cargo test` build the provider binaries the CLI spawns
# and `dform-direct`, which tests and benches run; `cargo run` runs the CLI
# (`default-run`).
default-members = [
    ".",
    "crates/dform-wire",
    "crates/dform-core",
    "crates/dform-grpc",
    "crates/dform-mock",
    "crates/dform-k8s",
    "crates/dform-provider-fake",
    "crates/dform-provider-k8s",
    "crates/dform-provider-ovh",
    "crates/dform-provider-postgres",
    "crates/dform-provider-vault",
    "crates/dform-provider-tailscale",
    "crates/dform-direct",
    "crates/dform-proptest",
    "crates/dform-s3",
    "crates/dform-lsp",
    "crates/dform-host",
    "crates/dform-sdk",
    "crates/dform-sdk-derive",
]
resolver = "3"

# The CLI: the language and engine (`dform-core`) over providers reached by
# gRPC (`dform-grpc`).
[package]
name = "dform"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
default-run = "dform"
autotests = false

[features]
# The wasm host (experimental, R-13b): a provider that is a component
# (`.wasm`) runs in wasmtime. Without it a component source is refused
# naming this feature, and the build needs no wasmtime.
wasm = ["dform-host/wasm"]
# OTLP/HTTP to OTEL_EXPORTER_OTLP_ENDPOINT (src/trace.rs), for a
# collector (Jaeger, Zipkin, Tempo) to show the run's spans. Off by
# default: its dependencies are a build's to ask for. The trace file
# (`--trace FILE`) is every build's.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:tracing-opentelemetry", "dep:async-trait"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
# Apply's progress block (R-127): the cursor, a line's clear and the
# terminal's width, nothing else (no events, no raw mode).
crossterm = { version = "=0.29.0", default-features = false }
serde_json = "1.0"
dform-core = { path = "crates/dform-core" }
# `dform render`: the Kubernetes provider's kinds, from its snapshot.
dform-k8s = { path = "crates/dform-k8s" }
dform-grpc = { path = "crates/dform-grpc" }
# How providers are started: the host's interfaces served beside each
# (R-13b), and the wasm host under `wasm`.
dform-host = { path = "crates/dform-host" }
# The s3 state backend (`store`): the S3 client, kept out of dform-core.
dform-s3 = { path = "crates/dform-s3" }
# The mock, served by `dform __provider fake`: dform spawns itself for it,
# so the mock is always of its own build.
dform-mock = { path = "crates/dform-mock" }
# `dform lsp`, the language server.
dform-lsp = { path = "crates/dform-lsp" }
clap_mangen = "0.3"
# The run's span and the trace file's subscriber (src/trace.rs), over
# dform-core's spans.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-core = { version = "0.1", default-features = false, features = ["std"] }
# The run's subscriber (src/trace.rs): the registry, the trace file, the
# exporter and `DFORM_LOG`'s lines its layers.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# The `otel` feature (src/trace.rs): OTLP over HTTP (protobuf), sent
# with the one HTTP client (R-103, dform-core's) rather than the
# exporter's reqwest.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "trace"], optional = true }
opentelemetry-http = { version = "=0.33.1", default-features = false, optional = true }
tracing-opentelemetry = { version = "=0.34.0", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }

[[bin]]
name = "dform"
path = "src/main.rs"

[[bench]]
name = "scale"
harness = false

# The integration tests: one binary, tests/main.rs, whose modules are
# the files under tests/ (`autotests` off), so the suite links once. A
# file that changes process-wide state is a binary of its own.
[[test]]
name = "main"
path = "tests/main.rs"

# Routes the progress lines (`progress::route`) of the whole process.
[[test]]
name = "apply_said"

# Raises the process's interrupt flag (`interrupt::request`).
[[test]]
name = "interrupt"

# Turns the executor's mutant hooks on (`executor::hooks`).
[[test]]
name = "model"

# Sets `DFORM_HOST` in the process's environment.
[[test]]
name = "provider_parallel"

# Sets the SDK's host of the process (`dform_sdk::set_host`).
[[test]]
name = "k8s_cluster"

[dev-dependencies]
# tests/model.rs turns the executor's mutant on (`executor::hooks`);
# tests/host_pace.rs serves HTTP/2 with `http::fake`.
dform-core = { path = "crates/dform-core", features = ["test-hooks", "fake"] }
# tests/s3.rs: the S3 store, and a fake S3 server to run it against.
dform-s3 = { path = "crates/dform-s3", features = ["fake"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
tree-sitter = "0.26"
tree-sitter-dform = { path = "tree-sitter-dform" }
# tests/provider_parallel.rs and tests/transport_ssh.rs run their servers
# on tokio.
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
# tests/ssh_provider.rs makes its sshd's host keys and the client's key
# (OpenSSH format), the version dform-core links.
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
# tests/ssh_provider.rs serves russh's agent on a unix socket.
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
# tests/recipients.rs makes the team's age identities; tests/given_secrets.rs
# opens and writes a file of given secrets as SOPS does (armored age, AES-256-GCM
# with a 32-byte IV, a SHA-512 MAC), the versions dform-core links.
age = { version = "0.11", default-features = false, features = ["armor"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.10"
base64 = "0.22"
# tests/provider_ovh.rs: the OVH provider against a fake OVH API.
dform-provider-ovh = { path = "crates/dform-provider-ovh", features = ["fake"] }
# tests/provider_postgres.rs: the Postgres provider against a fake server.
dform-provider-postgres = { path = "crates/dform-provider-postgres", features = ["fake"] }
# tests/vault_scheme.rs: the Vault provider's scheme against a fake Vault.
dform-provider-vault = { path = "crates/dform-provider-vault", features = ["fake"] }
# tests/provider_tailscale.rs: the Tailscale provider against a fake API.
dform-provider-tailscale = { path = "crates/dform-provider-tailscale", features = ["fake"] }
# tests/host_wasm.rs writes a component from its text; tests/host_grpc.rs
# calls the host as a native SDK provider does.
wat = "1"
dform-sdk = { path = "crates/dform-sdk" }
# tests/provider_parallel.rs serves an SDK provider's adapter in-process
# and calls it (the version dform-grpc links).
tonic = "0.13"
# tests/apply_confirm.rs answers the confirmation prompt on a pty.
expectrl = "0.9.0"

# scrypt mixes a master's key from its passphrase on every run that opens
# it (R-164): optimized in a debug build too, or each run of a test takes
# seconds.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# Linking is the cost of a dev build (lld is already the linker): full
# debug info made a relink of `dform` 11 s and the one test binary 800 MB.
# Line tables keep file and line in backtraces and cut the relink to 4 s.
[profile.dev]
debug = "line-tables-only"
