[workspace]
members = [
    ".",
    "crates/dform-wire",
    "crates/dform-core",
    "crates/dform-grpc",
    "crates/dform-mock",
    "crates/dform-k8s",
    "crates/dform-provider-fake",
    "crates/dform-provider-k8s",
    "tree-sitter-dform",
]
# `cargo build` and `cargo test` build the provider binaries the CLI spawns;
# `cargo run` runs the CLI (`default-run`).
default-members = [
    ".",
    "crates/dform-wire",
    "crates/dform-core",
    "crates/dform-grpc",
    "crates/dform-mock",
    "crates/dform-k8s",
    "crates/dform-provider-fake",
    "crates/dform-provider-k8s",
]
resolver = "3"

# The CLI: the language and engine (`dform-core`) over providers reached by
# gRPC (`dform-grpc`).
[package]
name = "dform"
version = "0.1.0"
edition = "2024"
default-run = "dform"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
dform-core = { path = "crates/dform-core" }
dform-grpc = { path = "crates/dform-grpc" }

[[bin]]
name = "dform"
path = "src/main.rs"

[[bench]]
name = "scale"
harness = false

[dev-dependencies]
tree-sitter = "0.26"
tree-sitter-dform = { path = "tree-sitter-dform" }
# tests/k8s_cluster.rs talks to the cluster it applies to.
kube = "4.2"
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
