[package]
name = "dform"
version = "0.1.0"
edition = "2024"
default-run = "dform"

[dependencies]
anyhow = "1.0"
ariadne = "0.6"
clap = { version = "4.5", features = ["derive"] }
logos = "0.16"
rowan = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
tonic = "0.13"
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.13"

[[bin]]
name = "dform"
path = "src/main.rs"

# The mock provider behind the plugin protocol: `src/fakecloud.rs` served
# over gRPC. The engine spawns it for every mock schema.
[[bin]]
name = "dform-provider-fake"
path = "src/bin/dform-provider-fake.rs"

[[bench]]
name = "scale"
harness = false
