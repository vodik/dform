[dev-dependencies]
# tests/model.rs turns the executor's mutant on (`executor::hooks`).
dform-core = { path = "crates/dform-core", features = ["test-hooks"] }
# tests/s3.rs: the S3 store, and a fake S3 server to run it against.
dform-s3 = { path = "crates/dform-s3", features = ["fake"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
tree-sitter = "0.26"
tree-sitter-dform = { path = "tree-sitter-dform" }
# tests/k8s_cluster.rs talks to the cluster it applies to.
kube = "4.2"
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
# tests/ssh_provider.rs makes its sshd's host keys and the client's key
# (OpenSSH format), the version dform-core links.
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
# tests/ssh_provider.rs serves russh's agent on a unix socket.
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
# tests/recipients.rs makes the team's age identities; tests/given_secrets.rs
# opens and writes a file of given secrets as SOPS does (armored age, AES-256-GCM
# with a 32-byte IV, a SHA-512 MAC), the versions dform-core links.
age = { version = "0.11", default-features = false, features = ["armor"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.10"
base64 = "0.22"
# tests/provider_ovh.rs: the OVH provider against a fake OVH API.
dform-provider-ovh = { path = "crates/dform-provider-ovh", features = ["fake"] }
# tests/provider_postgres.rs: the Postgres provider against a fake server.
dform-provider-postgres = { path = "crates/dform-provider-postgres", features = ["fake"] }
# tests/vault_scheme.rs: the Vault provider's scheme against a fake Vault.
dform-provider-vault = { path = "crates/dform-provider-vault", features = ["fake"] }
# tests/provider_tailscale.rs: the Tailscale provider against a fake API.
dform-provider-tailscale = { path = "crates/dform-provider-tailscale", features = ["fake"] }
# tests/host_wasm.rs writes a component from its text; tests/host_grpc.rs
# calls the host as a native SDK provider does.
wat = "1"
dform-sdk = { path = "crates/dform-sdk" }
# tests/provider_parallel.rs serves an SDK provider's adapter in-process
# and calls it (the version dform-grpc links).
tonic = "0.13"
# tests/apply_confirm.rs answers the confirmation prompt on a pty.
expectrl = "0.9.0"

# scrypt mixes a master's key from its passphrase on every run that opens
# it (R-164): optimized in a debug build too, or each run of a test takes
# seconds.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
